# evcc für die E2E-Tests von hello: nur Netz und PV (4321 W)
interval: 0.1s

site:
  title: Hello World
  meters:
    grid: grid
    pv:
      - pv

meters:
  - name: grid
    type: custom
    power:
      source: js
      script: |
        1000
  - name: pv
    type: custom
    power:
      source: js
      script: |
        4321
